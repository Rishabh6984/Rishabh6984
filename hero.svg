<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Hi there, I'm Rishabh Chaurasiya — MIS Executive and Data Analyst">
  <defs>
    <linearGradient id="h-aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0;0.5 0;-0.5 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="h-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".7"/><stop offset=".5" stop-color="#a78bfa" stop-opacity=".25"/><stop offset="1" stop-color="#f472b6" stop-opacity=".7"/>
    </linearGradient>
    <pattern id="h-dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity=".05"/></pattern>
    <radialGradient id="h-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".55"/><stop offset=".6" stop-color="#22d3ee" stop-opacity=".12"/><stop offset="1" stop-color="#0d0e16" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="h-namereveal"><rect x="40" y="120" width="700" height="80">
      <animate attributeName="y" values="200;200;120;120" keyTimes="0;.15;.4;1" dur="2.4s" fill="freeze"/>
    </rect></clipPath>
    <clipPath id="h-card"><rect x="0" y="0" width="1200" height="380" rx="22"/></clipPath>
    <style>
      .t{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
      .m{font-family:'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace}
      .fade{animation:h-in .9s ease-out both}
      .d1{animation-delay:.2s}.d2{animation-delay:1.6s}.d3{animation-delay:2s}.d4{animation-delay:2.4s}
      @keyframes h-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
      .pulse{animation:h-pulse 1.6s ease-in-out infinite;transform-origin:62px 58px;transform-box:view-box}
      @keyframes h-pulse{0%,100%{opacity:.9;transform:scale(1)}50%{opacity:.2;transform:scale(2.2)}}
      .role{opacity:0;animation:h-role 12s infinite both}
      .r2{animation-delay:3s}.r3{animation-delay:6s}.r4{animation-delay:9s}
      .r1{animation-name:h-role1}
      @keyframes h-role{0%{opacity:0;transform:translateY(12px)}4%,22%{opacity:1;transform:none}26%,100%{opacity:0;transform:translateY(-12px)}}
      @keyframes h-role1{0%,22%{opacity:1;transform:none}26%,96%{opacity:0;transform:translateY(-12px)}100%{opacity:1;transform:none}}
      .spin{animation:h-spin 14s linear infinite;transform-origin:930px 190px;transform-box:view-box}
      .spinr{animation:h-spin 20s linear infinite reverse;transform-origin:930px 190px;transform-box:view-box}
      @keyframes h-spin{to{transform:rotate(360deg)}}
      .rec{animation:h-blink 1s steps(1) infinite}
      @keyframes h-blink{50%{opacity:0}}
      .bob{animation:h-bob 4s ease-in-out infinite}
      @keyframes h-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    </style>
  </defs>

  <g clip-path="url(#h-card)">
    <rect width="1200" height="380" fill="#0d0e16"/>
    <rect width="1200" height="380" fill="url(#h-dots)"/>
    <circle cx="930" cy="190" r="230" fill="url(#h-glow)"/>
  </g>
  <rect x="1" y="1" width="1198" height="378" rx="21" fill="none" stroke="url(#h-border)" stroke-width="1.5"/>

  <!-- pill -->
  <g class="fade d1">
    <rect x="44" y="40" width="200" height="36" rx="18" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-opacity=".4"/>
    <circle class="pulse" cx="62" cy="58" r="5" fill="#22d3ee"/>
    <circle cx="62" cy="58" r="5" fill="#22d3ee"/>
    <text x="76" y="63" class="m" font-size="14" fill="#a5f3fc">open to collabs</text>
  </g>

  <!-- typed greeting -->
  <g>
    <text x="44" y="112" class="m" font-size="22" fill="#cbd5e1" clip-path="url(#h-type)">Hi there, I'm</text>
    <clipPath id="h-type"><rect x="44" y="88" height="32" width="0"><animate attributeName="width" values="0;0;180" keyTimes="0;.3;1" dur="1.4s" fill="freeze"/></rect></clipPath>
    <rect x="44" y="92" width="3" height="24" fill="#22d3ee"><animate attributeName="x" values="44;44;222" keyTimes="0;.3;1" dur="1.4s" fill="freeze"/><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
  </g>

  <!-- name -->
  <g clip-path="url(#h-namereveal)">
    <text x="42" y="182" class="t" font-size="62" font-weight="800" fill="url(#h-aurora)" letter-spacing="-1">Rishabh Chaurasiya</text>
  </g>

  <!-- roles -->
  <g class="fade d2">
    <text x="44" y="226" class="m" font-size="20" fill="#64748b">&gt;</text>
    <g transform="translate(66 0)">
      <text class="role r1 m" y="226" font-size="20" fill="#e2e8f0">MIS Executive @ Cheers Hypermarket</text>
      <text class="role r2 m" y="226" font-size="20" fill="#e2e8f0">Data Analyst · Python · SQL</text>
      <text class="role r3 m" y="226" font-size="20" fill="#e2e8f0">Google Apps Script automator</text>
      <text class="role r4 m" y="226" font-size="20" fill="#e2e8f0">Dashboards: Looker · Power BI · Tableau</text>
    </g>
  </g>

  <text x="44" y="272" class="t fade d3" font-size="17" fill="#94a3b8">I turn raw business data into dashboards, automated reports and workflows that save teams hours.</text>

  <!-- meta row -->
  <g class="fade d4 t" font-size="15" fill="#cbd5e1">
    <g transform="translate(44 300)">
      <path d="M8 1a6 6 0 0 0-6 6c0 4.5 6 11 6 11s6-6.5 6-11a6 6 0 0 0-6-6zm0 8.2A2.2 2.2 0 1 1 8 4.8a2.2 2.2 0 0 1 0 4.4z" fill="#f472b6"/>
      <text x="22" y="14">Mumbai, India</text>
    </g>
    <g transform="translate(170 300)">
      <rect x="1" y="5" width="16" height="12" rx="2" fill="none" stroke="#22d3ee" stroke-width="1.6"/><path d="M6 5V3h6v2" fill="none" stroke="#22d3ee" stroke-width="1.6"/>
      <text x="26" y="14">Cheers Hypermarket</text>
    </g>
    <g transform="translate(380 300)">
      <path d="M3 2h12v14H3z M6 6h6 M6 9h6 M6 12h4" fill="none" stroke="#a78bfa" stroke-width="1.6"/>
      <text x="24" y="14">In data &amp; ops since 2021</text>
    </g>
  </g>

  <!-- viewfinder (right) -->
  <g transform="translate(0 0)">
    <g class="spinr"><circle cx="930" cy="190" r="128" fill="none" stroke="#a78bfa" stroke-opacity=".35" stroke-dasharray="2 10"/></g>
    <g class="spin"><circle cx="930" cy="190" r="108" fill="none" stroke="url(#h-aurora)" stroke-width="2" stroke-dasharray="120 40 30 40"/></g>
    <g class="bob">
      <circle cx="930" cy="190" r="86" fill="#131526" stroke="#22d3ee" stroke-opacity=".3"/>
      <!-- simple illustrated avatar -->
      <circle cx="930" cy="172" r="32" fill="#f1c7a0"/>
      <path d="M896 168c0-26 18-38 34-38s34 12 34 38c-6-12-18-18-34-18s-28 6-34 18z" fill="#1e1b2e"/>
      <circle cx="918" cy="176" r="3.2" fill="#1e1b2e"/><circle cx="942" cy="176" r="3.2" fill="#1e1b2e"/>
      <path d="M920 189q10 8 20 0" fill="none" stroke="#9a4b3a" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M876 262c4-34 26-52 54-52s50 18 54 52z" fill="#22d3ee" fill-opacity=".85"/>
      <path d="M916 214l14 18 14-18" fill="#ffffff" fill-opacity=".9"/>
      <!-- waving hand -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 996 214;-22 996 214;14 996 214;-22 996 214;0 996 214;0 996 214" keyTimes="0;.12;.24;.36;.48;1" dur="3s" repeatCount="indefinite"/>
        <path d="M984 232l14-34" stroke="#f1c7a0" stroke-width="12" stroke-linecap="round"/>
        <circle cx="999" cy="194" r="10" fill="#f1c7a0"/>
      </g>
    </g>
    <!-- corner brackets drawing in -->
    <g fill="none" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="40" stroke-dashoffset="40">
      <path d="M790 80v-26h26"/><path d="M1044 54h26v26"/><path d="M1070 300v26h-26"/><path d="M816 326h-26v-26"/>
      <animate attributeName="stroke-dashoffset" values="40;0" dur="1s" begin="0s" fill="freeze"/>
    </g>
    <circle class="rec" cx="808" cy="70" r="5" fill="#ef4444"/>
    <text x="820" y="75" class="m" font-size="12" fill="#e2e8f0">REC</text>
    <text x="1052" y="75" class="m" font-size="12" fill="#94a3b8" text-anchor="end">rishabh_hello.svg</text>
    <rect x="808" y="306" width="244" height="3" rx="1.5" fill="#ffffff" fill-opacity=".12"/>
    <rect x="808" y="306" width="0" height="3" rx="1.5" fill="url(#h-aurora)"><animate attributeName="width" values="0;244" dur="3s" repeatCount="indefinite"/></rect>
  </g>
</svg>
