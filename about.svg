<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="What I build and my experience timeline">
  <defs>
    <linearGradient id="a-border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".7"/><stop offset=".5" stop-color="#a78bfa" stop-opacity=".25"/><stop offset="1" stop-color="#f472b6" stop-opacity=".7"/></linearGradient>
    <linearGradient id="a-aurora" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <pattern id="a-dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity=".05"/></pattern>
    <style>
      .t{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}.m{font-family:'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace}
      .in{animation:a-in .8s ease-out both}
      @keyframes a-in{from{opacity:0}to{opacity:1}}
      .cur{animation:a-blink 1s steps(1) infinite}@keyframes a-blink{50%{opacity:0}}
      .bar{animation:a-bar 3s ease-in-out infinite alternate both;transform-box:fill-box;transform-origin:left}
      @keyframes a-bar{from{transform:scaleX(.25)}to{transform:scaleX(1)}}
      .ping{animation:a-ping 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
      @keyframes a-ping{from{opacity:.8;transform:scale(1)}to{opacity:0;transform:scale(2.6)}}
    </style>
  </defs>

  <!-- LEFT CARD: what I build -->
  <rect x="0" y="0" width="590" height="400" rx="22" fill="#0d0e16"/><rect x="0" y="0" width="590" height="400" rx="22" fill="url(#a-dots)"/>
  <rect x="1" y="1" width="588" height="398" rx="21" fill="none" stroke="url(#a-border)" stroke-width="1.5"/>
  <text x="32" y="44" class="m" font-size="13" letter-spacing="3" fill="#94a3b8">// WHAT I BUILD</text>

  <!-- fake browser -->
  <g transform="translate(32 64)">
    <rect width="526" height="120" rx="12" fill="#131526" stroke="#ffffff" stroke-opacity=".08"/>
    <circle cx="18" cy="18" r="5" fill="#f87171"/><circle cx="34" cy="18" r="5" fill="#fbbf24"/><circle cx="50" cy="18" r="5" fill="#34d399"/>
    <rect x="70" y="8" width="440" height="20" rx="10" fill="#0d0e16"/>
    <text x="84" y="22" class="m" font-size="11" fill="#94a3b8">script.google.com/macros/s/…/exec?view=sales</text>
    <rect class="cur" x="392" y="11" width="2" height="14" fill="#22d3ee"/>
    <!-- mini dashboard -->
    <g transform="translate(16 42)">
      <rect width="110" height="64" rx="8" fill="#22d3ee" fill-opacity=".08"/><text x="10" y="22" class="m" font-size="10" fill="#94a3b8">SALES TODAY</text><text x="10" y="50" class="t" font-size="22" font-weight="700" fill="#e2e8f0">▲ 12%</text>
      <g transform="translate(122 0)"><rect width="200" height="64" rx="8" fill="#a78bfa" fill-opacity=".08"/>
        <rect class="bar" x="10" y="12" width="170" height="8" rx="4" fill="#22d3ee" style="animation-delay:0s"/>
        <rect class="bar" x="10" y="28" width="130" height="8" rx="4" fill="#a78bfa" style="animation-delay:.4s"/>
        <rect class="bar" x="10" y="44" width="90" height="8" rx="4" fill="#f472b6" style="animation-delay:.8s"/></g>
      <g transform="translate(334 0)"><rect width="160" height="64" rx="8" fill="#f472b6" fill-opacity=".08"/>
        <polyline points="10,52 34,40 58,46 82,26 106,32 130,14 150,18" fill="none" stroke="#f472b6" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="200" stroke-dashoffset="200"><animate attributeName="stroke-dashoffset" values="200;0;0" keyTimes="0;.5;1" dur="4s" repeatCount="indefinite"/></polyline></g>
    </g>
  </g>

  <!-- capability rows -->
  <g class="t">
    <g class="in" style="animation-delay:.2s" transform="translate(32 206)">
      <rect width="44" height="44" rx="12" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".4"/>
      <path d="M12 30h20M14 26v-6M20 26v-10M26 26v-8M32 26v-12" stroke="#22d3ee" stroke-width="2.4" stroke-linecap="round" transform="translate(-1 0)"/>
      <text x="60" y="19" font-size="16" font-weight="700" fill="#e2e8f0">Dashboards &amp; BI</text>
      <text x="60" y="38" font-size="13" fill="#94a3b8">Sales, visits, damage logs, delegation — Looker Studio, Power BI, Tableau</text>
    </g>
    <g class="in" style="animation-delay:.5s" transform="translate(32 266)">
      <rect width="44" height="44" rx="12" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".4"/>
      <path d="M17 14l-7 8 7 8M27 14l7 8-7 8" fill="none" stroke="#a78bfa" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="19" font-size="16" font-weight="700" fill="#e2e8f0">Apps Script automation</text>
      <text x="60" y="38" font-size="13" fill="#94a3b8">Sheets + Forms + Drive workflows and HTML web apps that kill manual work</text>
    </g>
    <g class="in" style="animation-delay:.8s" transform="translate(32 326)">
      <rect width="44" height="44" rx="12" fill="#f472b6" fill-opacity=".12" stroke="#f472b6" stroke-opacity=".4"/>
      <ellipse cx="22" cy="15" rx="10" ry="4" fill="none" stroke="#f472b6" stroke-width="2.2"/><path d="M12 15v14c0 2.2 4.5 4 10 4s10-1.8 10-4V15M12 22c0 2.2 4.5 4 10 4s10-1.8 10-4" fill="none" stroke="#f472b6" stroke-width="2.2"/>
      <text x="60" y="19" font-size="16" font-weight="700" fill="#e2e8f0">Data analysis</text>
      <text x="60" y="38" font-size="13" fill="#94a3b8">Python, Pandas, SQL and Odoo ERP data turned into decisions</text>
    </g>
  </g>

  <!-- RIGHT CARD: experience timeline -->
  <g transform="translate(610 0)">
    <rect width="590" height="400" rx="22" fill="#0d0e16"/><rect width="590" height="400" rx="22" fill="url(#a-dots)"/>
    <rect x="1" y="1" width="588" height="398" rx="21" fill="none" stroke="url(#a-border)" stroke-width="1.5"/>
    <text x="32" y="44" class="m" font-size="13" letter-spacing="3" fill="#94a3b8">// EXPERIENCE</text>

    <rect x="49" y="72" width="2" height="290" rx="1" fill="#ffffff" fill-opacity=".08"/>
    <rect x="49" y="72" width="2" height="290" rx="1" fill="url(#a-aurora)"><animate attributeName="height" values="0;290" dur="2.4s" fill="freeze"/></rect>

    <g class="t">
      <g class="in" style="animation-delay:.2s" transform="translate(0 84)">
        <circle class="ping" cx="50" cy="0" r="7" fill="#22d3ee"/><circle cx="50" cy="0" r="7" fill="#22d3ee"/>
        <text x="76" y="5" font-size="17" font-weight="700" fill="#e2e8f0">Cheers Hypermarket</text>
        <text x="558" y="5" class="m" font-size="12" fill="#22d3ee" text-anchor="end">DEC 2025 — NOW</text>
        <text x="76" y="27" font-size="13" fill="#94a3b8">MIS Executive · Apps Script ops automation, SANVIK dashboard, Odoo ERP</text>
      </g>
      <g class="in" style="animation-delay:.7s" transform="translate(0 160)">
        <circle cx="50" cy="0" r="6" fill="#0d0e16" stroke="#a78bfa" stroke-width="2.4"/>
        <text x="76" y="5" font-size="17" font-weight="700" fill="#e2e8f0">Robokart</text>
        <text x="558" y="5" class="m" font-size="12" fill="#a78bfa" text-anchor="end">MAY — DEC 2025</text>
        <text x="76" y="27" font-size="13" fill="#94a3b8">MIS Executive · Looker Studio &amp; Google Sites dashboards, web apps</text>
      </g>
      <g class="in" style="animation-delay:1.2s" transform="translate(0 236)">
        <circle cx="50" cy="0" r="6" fill="#0d0e16" stroke="#c084fc" stroke-width="2.4"/>
        <text x="76" y="5" font-size="17" font-weight="700" fill="#e2e8f0">Doordarshan Sahyadri</text>
        <text x="558" y="5" class="m" font-size="12" fill="#c084fc" text-anchor="end">JUN 2024 — MAY 2025</text>
        <text x="76" y="27" font-size="13" fill="#94a3b8">MIS Executive · IT systems, data workflows and analysis</text>
      </g>
      <g class="in" style="animation-delay:1.7s" transform="translate(0 312)">
        <circle cx="50" cy="0" r="6" fill="#0d0e16" stroke="#f472b6" stroke-width="2.4"/>
        <text x="76" y="5" font-size="17" font-weight="700" fill="#e2e8f0">Marshall Fire &amp; Rescue Services</text>
        <text x="558" y="5" class="m" font-size="12" fill="#f472b6" text-anchor="end">2021 — 2023</text>
        <text x="76" y="27" font-size="13" fill="#94a3b8">Technician &amp; Back-Office · billing data, reconciliation, reports</text>
      </g>
    </g>
    <text x="76" y="378" class="m" font-size="12" fill="#64748b">EDU · B.Sc. IT — RD National College, Mumbai University (2023)</text>
  </g>
</svg>
